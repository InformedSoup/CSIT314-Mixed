{% extends "base.html" %}
{% block title %}Delete {{ company.companyName }}{% endblock %}
{% block content %}
<p><a href="{{ url_for('company.displayCompanyInfo', companyId=company.companyId) }}">← Back to company</a></p>
<h1>Delete company information?</h1>
<p class="sub">This removes <strong>{{ company.companyName }}</strong> (UEN {{ company.regNumber }}) from the platform. It cannot be undone.</p>
<div class="card" style="max-width:600px">
  <form method="post" class="actions" style="margin-top:0">
    <button class="btn danger" type="submit">Yes, delete</button>
    <a class="btn ghost" href="{{ url_for('company.displayCompanyInfo', companyId=company.companyId) }}">Cancel</a>
  </form>
</div>
{% endblock %}
